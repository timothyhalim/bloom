<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Bloom UI mockup</title>
<style>
/* tokens: app/src/main/java/dev/bloom/editor/ui/Theme.kt (dark only, like the app) */
:root{
  --canvas:#0E0E0E;--surface:#171717;--sc:#1F1F1F;--sch:#292929;
  --on:#EDEDED;--onv:#A8A8A8;--outline:#757575;--outv:#333333;
  --pri:#FFC857;--onpri:#2A1D00;--pric:#4A3600;--onpric:#FFE2A6;
  --scrim:rgba(0,0,0,.32);--page:#000;
  /* Material 3 dark defaults the app doesn't override (snackbar = inverse surface) */
  --snack:#E6E0E9;--onsnack:#322F35;--snackact:#6750A4;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html,body{margin:0;background:var(--page);color:var(--on);overflow-x:hidden;
  font:16px/24px Roboto,system-ui,-apple-system,"Segoe UI",sans-serif}
button,input{font:inherit;color:inherit;background:none;border:0;padding:0;margin:0}
button{cursor:pointer;text-align:inherit}
button:disabled{cursor:default}
:focus-visible{outline:2px solid var(--pri);outline-offset:2px}

/* mockup navigation (not part of the app) */
.nav{position:sticky;top:0;z-index:9;display:flex;gap:8px;align-items:center;height:52px;padding:0 8px;
  background:var(--page);max-width:390px;margin:0 auto}
.nav .chips{display:flex;gap:6px;overflow-x:auto;flex:1;scrollbar-width:none;padding:2px}
.nav .chips::-webkit-scrollbar{display:none}
.nav button{flex:none;height:36px;padding:0 12px;border-radius:18px;border:1px solid var(--outline);color:var(--onv);font-size:12px;font-weight:500;line-height:16px}
.nav button[aria-current=true]{background:var(--on);color:var(--surface);border-color:var(--on)}

.phone{position:relative;width:100%;max-width:390px;margin:0 auto;height:calc(100dvh - 52px);min-height:620px;max-height:844px;
  background:var(--canvas);overflow:hidden}
.scr{position:absolute;inset:0;display:flex;flex-direction:column}

/* icons: stroke paths on a 24 grid, the same as ui/Theme.kt */
.i{display:inline-grid;place-items:center;width:24px;height:24px;flex:none}
.i svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.ib{width:48px;height:48px;display:grid;place-items:center;border-radius:24px;color:var(--on);flex:none}
.ib:active{background:var(--sch)}
.ib:disabled{color:var(--outline)}
.ib.ok,.ib.pri{color:var(--pri)}

/* top bar */
.top{height:56px;display:flex;align-items:center;padding:0 4px;flex:none}
.top .sp{flex:1}
.pill{height:40px;padding:0 18px;border-radius:14px 4px 14px 4px;background:var(--pri);color:var(--onpri);font-weight:500;font-size:14px;margin-right:8px;display:inline-flex;align-items:center}
.pill:disabled{background:var(--sch);color:var(--outline)}
.pill.busy{background:var(--sch);color:var(--on);gap:8px}
.prog{width:20px;height:20px;border-radius:50%;background:conic-gradient(var(--pri) var(--p),var(--outline) 0);
  -webkit-mask:radial-gradient(circle,transparent 7px,#000 7.5px);mask:radial-gradient(circle,transparent 7px,#000 7.5px)}

/* canvas */
.canvas{position:relative;flex:1;min-height:0;background:var(--canvas);overflow:hidden}
.canvas[data-cv]{touch-action:none;user-select:none;-webkit-user-select:none}
.photo{position:absolute;left:0;top:0}
.maskdisp{position:absolute;pointer-events:none}
.over{overflow:visible}
.canvas.orig .maskdisp,.canvas.orig .lay,.canvas.nomask .maskdisp{visibility:hidden}
.canvas:not([data-brush])>.ring{display:none}

/* floating canvas instruments: navigator, layer rail + bubble, brush ring, loupe */
.navi{position:absolute;left:8px;bottom:calc(var(--cover,0px) + 8px);width:66px;height:88px;border:1px solid var(--outline);border-radius:4px;overflow:hidden;touch-action:none;display:none}
.navi.show{display:block}
.navi svg{width:100%;height:100%;display:block}
.navi .vp{position:absolute;border:2px solid #fff;box-shadow:0 0 0 1px #000,inset 0 0 0 1px #000;pointer-events:none}
.rail{position:absolute;top:8px;right:4px;width:48px;max-height:calc(100% - 16px - var(--cover,0px));display:flex;flex-direction:column;align-items:center;z-index:5;transition:opacity .2s}
.rh{height:48px;width:48px;display:flex;align-items:center;justify-content:center;flex:none;touch-action:none}
.rh .pl{min-height:28px;display:inline-flex;align-items:center;gap:1px;padding:0 4px;border-radius:14px;background:var(--sc);border:1px solid var(--outline);font-size:11px;line-height:16px;color:var(--on)}
.rh .pl .i,.rh .pl svg{width:14px;height:14px}
.rh.all .pl{background:var(--pric);border-color:var(--pri)}
.rbox{position:relative;min-height:0;display:flex;flex-direction:column}
.rs{overflow-y:auto;scrollbar-width:none;touch-action:none;min-height:0}
.rs::-webkit-scrollbar{display:none}
.rl.dim{opacity:.45}
.rt{width:48px;height:48px;display:grid;place-items:center;position:relative;flex:none}
.rt .t{width:36px;height:36px;border-radius:8px;background:var(--sc);border:1px solid var(--outline);display:grid;place-items:center;color:var(--on);overflow:hidden}
.rt .i,.rt .i svg{width:18px;height:18px}
.rt.act .t{border:2px solid var(--pri)}
.rt.act::before{content:"";position:absolute;left:0;top:16px;width:3px;height:16px;border-radius:2px;background:var(--pri)}
.rt.pend .t{border:2px dashed var(--pri)}
.rt.off .t{opacity:.45}
.rt.off::after{content:"";position:absolute;left:10px;right:10px;top:23px;border-top:2px solid var(--on);transform:rotate(-45deg)}
.rt .ml{position:absolute;left:1px;top:0;bottom:0;width:2px;background:var(--outline)}
.rt .md{position:absolute;top:4px;right:2px;width:10px;height:10px;border-radius:50%;border:1px solid var(--on);background:linear-gradient(90deg,var(--on) 50%,transparent 50%);box-shadow:0 0 0 1px var(--canvas)}
.rt.drag{z-index:2}
.rt.drag .t{box-shadow:0 4px 12px rgba(0,0,0,.7);transform:scale(1.15)}
.ra{position:absolute;left:0;width:48px;height:32px;display:grid;place-items:center;z-index:1}
.ra .p{width:36px;height:20px;border-radius:10px;background:var(--sc);border:1px solid var(--outline);display:grid;place-items:center}
.ra .i,.ra .i svg{width:14px;height:14px}
.ra.up{top:0}.ra.dn{bottom:0}
.railtab{position:absolute;top:8px;right:0;width:48px;height:48px;display:none;justify-content:flex-end;align-items:center;z-index:5}
.railtab .tb2{width:20px;height:48px;border-radius:8px 0 0 8px;background:var(--sc);display:grid;place-items:center}
.railtab .i,.railtab .i svg{width:14px;height:14px}
.norail .rail{display:none}.norail .railtab{display:flex}
.canvas.gesture .rail{opacity:.25}
.bscrim{position:absolute;inset:0;z-index:3}
.bubble{position:absolute;right:56px;width:236px;background:var(--sch);border:1px solid var(--outline);border-radius:12px;padding:0 0 8px;box-shadow:0 4px 16px rgba(0,0,0,.5);z-index:4;touch-action:auto}
.bubble::after{content:"";position:absolute;right:-7px;top:34px;width:12px;height:12px;background:var(--sch);border:1px solid var(--outline);border-left:0;border-bottom:0;transform:rotate(45deg)}
.bt{display:flex;align-items:center;min-height:48px;padding-left:16px}
.bt .bn{flex:1;min-width:0;padding:12px 0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:text}
.bt input{flex:1;min-width:0;font-size:16px;caret-color:var(--pri);height:48px}
.bo{display:flex;align-items:center;min-height:48px;padding:0 16px}
.bo span{min-width:56px;font-size:12px;color:var(--onv)}
.bo input[type=range]{flex:1;min-width:0}
.bo output{min-width:40px;padding-left:4px;font-size:13px}
.bb{display:flex;align-items:center;min-height:48px;padding:0 8px 0 16px}
.bb>span{min-width:56px;font-size:12px;color:var(--onv)}
.ba{display:flex;padding:0 8px}
.ba button{flex:1;min-height:52px;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:11px;line-height:16px;border-radius:8px;color:var(--on);text-align:center}
.ba button:disabled{color:var(--outline)}
.ba .i,.ba .i svg{width:20px;height:20px}
.sw2{display:flex;align-items:center;padding:4px 16px;gap:8px;width:100%;text-align:left}
.sw2 span{flex:1}.sw2 b{display:block;font-weight:400;font-size:14px;line-height:20px}.sw2 small{display:block;font-size:11px;line-height:16px;color:var(--onv)}
.ring,.pvring{position:absolute;border-radius:50%;border:1.5px solid #fff;box-shadow:0 0 0 1px rgba(0,0,0,.5),inset 0 0 0 1px rgba(0,0,0,.5);pointer-events:none;transform:translate(-50%,-50%)}
.ring{left:50%;top:40%}
.pvring.soft{border-style:dashed}
.pvring i{position:absolute;left:50%;top:50%;border-radius:50%;border:1.5px solid #fff;box-shadow:0 0 0 1px rgba(0,0,0,.5);transform:translate(-50%,-50%)}
.loupe{position:absolute;top:8px;left:8px;width:104px;height:104px;border-radius:50%;border:2px solid var(--on);overflow:hidden;background:#000;box-shadow:0 2px 8px rgba(0,0,0,.6);pointer-events:none}
.loupe.low{top:auto;bottom:calc(var(--cover,0px) + 8px)}
.loupe svg,.loupe canvas{position:absolute;inset:0;width:100%;height:100%}
.loupe .ring{left:50%;top:50%}
.snack{position:absolute;left:12px;right:12px;bottom:calc(var(--cover,0px) + 4px);min-height:48px;background:var(--snack);color:var(--onsnack);border-radius:4px;display:flex;align-items:center;padding:0 8px 0 16px;font-size:14px;line-height:20px;z-index:6;box-shadow:0 3px 8px rgba(0,0,0,.4)}
.snack span{flex:1;padding:14px 0}
.snack button{color:var(--snackact);font-weight:500;font-size:14px;padding:0 12px;min-height:40px}

/* floating bottom chrome: the bar holds what you edit, the box above holds its settings */
.float{position:absolute;left:8px;right:8px;bottom:calc(8px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:6px;z-index:2;pointer-events:none}
#stack{display:flex;flex-direction:column;gap:6px}
#stack>*,.bar{pointer-events:auto}
.bar{display:flex;align-items:center;height:60px;padding:0 4px;border-radius:20px;background:var(--surface);border:1px solid var(--outline)}
.box{background:var(--surface);border:1px solid var(--outline);border-radius:16px;display:flex;flex-direction:column}
.br{display:flex;align-items:center;min-height:48px}
.br.p48{padding-right:48px}
.br input[type=range]{flex:1;min-width:0}
.lab{min-width:84px;padding-left:16px;font-size:12px;line-height:16px;color:var(--onv);flex:none}
.two{min-width:84px;padding-left:16px;display:flex;flex-direction:column;flex:none}
.two b{font-weight:400;font-size:12px;line-height:14px;color:var(--onv)}
.two small{font-size:11px;line-height:13px;color:rgba(168,168,168,.7)}
.val{min-width:36px;font-size:14px;line-height:20px;color:var(--on);flex:none;font-variant-numeric:tabular-nums}
.info,.hint{flex:1;min-width:0;font-size:12px;line-height:16px;color:var(--onv)}
.info{padding:0 8px}
.tool{flex:1;height:58px;display:grid;place-items:center;color:var(--on)}
.tool .i,.tool .i svg{width:26px;height:26px}
.tl{width:54px;height:48px;display:grid;place-items:center;flex:none}
.tl .m{width:36px;height:30px;border-radius:14px 4px 14px 4px;background:var(--pric);color:var(--onpric);display:grid;place-items:center}
.sfw{flex:1;min-width:0;position:relative;align-self:stretch;display:flex;align-items:center}
.sc{display:flex;align-items:center;overflow-x:auto;scrollbar-width:none;width:100%;touch-action:pan-x}
.sc::-webkit-scrollbar{display:none}
.sfw.r .sc{-webkit-mask-image:linear-gradient(to right,#000 calc(100% - 28px),transparent);mask-image:linear-gradient(to right,#000 calc(100% - 28px),transparent)}
.sfw.l .sc{-webkit-mask-image:linear-gradient(to right,transparent,#000 28px);mask-image:linear-gradient(to right,transparent,#000 28px)}
.sfw.l.r .sc{-webkit-mask-image:linear-gradient(to right,transparent,#000 28px,#000 calc(100% - 28px),transparent);mask-image:linear-gradient(to right,transparent,#000 28px,#000 calc(100% - 28px),transparent)}
.sfw.l::before,.sfw.r::after{content:"";position:absolute;top:50%;margin-top:-5px;border:5px solid transparent;pointer-events:none}
.sfw.l::before{left:1px;border-right-color:var(--onv);border-left-width:0}
.sfw.r::after{right:1px;border-left-color:var(--onv);border-right-width:0}
.row6{flex:1;display:flex;align-items:center;gap:6px}
/* icon chips: a parameter, mode, brush or step type (ParamChip, TypeButton) */
.pi{width:48px;height:48px;flex:none;display:grid;place-items:center;border-radius:10px;color:var(--on);position:relative}
.pi .i,.pi .i svg{width:22px;height:22px}
.pi.sel{background:var(--sch);color:var(--pri)}
.pi.sel.ul::after{content:"";position:absolute;left:8px;right:8px;bottom:0;height:2px;background:var(--pri)}
.pi .dot{position:absolute;top:6px;right:6px;width:5px;height:5px;border-radius:50%;background:var(--pri)}
.sb{position:absolute;top:2px;right:2px;width:14px;height:14px;border-radius:7px;background:var(--pri);color:var(--canvas);display:grid;place-items:center}
.sb.m{background:var(--on)}
.sb .i,.sb .i svg{width:12px;height:12px}
.sb .i svg{stroke-width:2.6}
.stc{width:48px;height:48px;flex:none;display:grid;place-items:center;position:relative}
.stc .f{width:48px;height:36px;border-radius:10px;border:1px solid var(--outline);display:grid;place-items:center;position:relative}
.stc.sel .f{border:2px solid var(--pri)}
.stc .i,.stc .i svg{width:20px;height:20px}
.stc.hid .f>.i{color:var(--outline)}
.stc.hid .f::after{content:"";position:absolute;left:12px;right:12px;top:17px;border-top:2px solid var(--on);transform:rotate(-45deg)}
.sgn{width:48px;height:48px;display:grid;place-items:center;flex:none}
.sgn span{width:28px;height:28px;border-radius:14px;background:var(--pri);color:var(--canvas);display:grid;place-items:center}
.sgn.m span{background:var(--on)}
.sgn .i,.sgn .i svg{width:20px;height:20px}
.mb{width:48px;height:48px;flex:none;border-radius:12px;display:grid;place-items:center;color:var(--on);position:relative}
.mb.on{background:var(--pric);color:var(--onpric)}
.mb b{position:absolute;right:6px;bottom:2px;font-size:10px;line-height:12px;font-weight:400}
.mo .i{transition:transform .2s}
.mo.open .i{transform:rotate(180deg)}
.runb{width:48px;align-self:stretch;flex:none;display:flex;flex-direction:column;align-items:center;justify-content:center;border-radius:10px;color:var(--outline)}
.runb.ready{color:var(--pri)}
.runb small{font-size:9px;line-height:11px;color:var(--onv);max-width:48px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.runb .ap{font-size:12px;line-height:16px;white-space:nowrap}
.runb .spin{width:22px;height:22px}
.caret{width:24px;align-self:stretch;flex:none;display:grid;place-items:center;color:var(--on)}
.caret:disabled{color:var(--outline)}
.caret .i,.caret .i svg{width:18px;height:18px}
.chip{min-height:48px;min-width:48px;padding:0 10px;border-radius:10px;font-size:12px;line-height:16px;font-weight:500;color:var(--onv);display:inline-flex;align-items:center;justify-content:center;flex:none;white-space:nowrap}
.chip.on{background:var(--sch);color:var(--on)}
.tb{min-height:40px;padding:0 12px;font-weight:500;font-size:14px;line-height:20px;color:var(--pri);border-radius:20px;flex:none}
.tb.v{color:var(--onv)}
.tb.w{color:var(--on);font-weight:400}
.tb:disabled{color:var(--outline)}
.tb.s{font-size:12px;font-weight:400;color:var(--on)}
.tb.s:disabled{color:var(--outline)}
.pf{flex:1;min-width:0;padding:0 8px;font-size:14px;height:48px;caret-color:var(--pri)}
.pf::placeholder{color:var(--outline)}
.status{flex:1;min-width:0;display:flex;align-items:center;gap:8px;font-size:12px;line-height:16px;color:var(--onv)}
.status.st16{padding-left:16px}
.retry{flex:1;min-width:0;font-size:12px;line-height:16px;color:var(--on);padding:8px 12px;text-align:center}
.spin{width:16px;height:16px;border-radius:50%;border:2px solid var(--pri);border-right-color:transparent;animation:sp 1s linear infinite;flex:none}
@keyframes sp{to{transform:rotate(360deg)}}
.swc{width:48px;height:48px;display:grid;place-items:center;flex:none}
.swc span{width:30px;height:30px;border-radius:50%;border:1px solid var(--outline);padding:3px;background-clip:content-box}
.swc[aria-selected=true] span{border:2px solid var(--pri)}
.smp{width:48px;height:48px;padding:12px;flex:none}
.smp span{display:block;width:24px;height:24px;border-radius:12px;border:1px solid var(--on)}
.ckr{display:flex;align-items:center;min-height:44px;padding:0 8px;font-size:13px;line-height:18px;width:100%;text-align:left;cursor:pointer}
.ckb{width:18px;height:18px;border-radius:2px;border:2px solid var(--onv);margin:0 15px;flex:none;display:grid;place-items:center;color:var(--onpri)}
.ckb .i,.ckb .i svg{width:14px;height:14px}
.ckb .i svg{stroke-width:3}
[aria-checked=true]>.ckb{background:var(--pri);border-color:var(--pri)}
[aria-checked=false]>.ckb .i{visibility:hidden}
.note{padding:2px 16px;font-size:11px;line-height:16px;color:var(--onv)}
.lstrip{flex:1;min-width:0;height:40px;margin:0 10px;position:relative;touch-action:none}
.lstrip svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.curves{height:170px;padding:0 8px}
.curves>svg{flex:1;margin:6px 12px 10px;width:calc(100% - 24px)}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:48px;margin:0;background:none;--a:0%;--b:0%}
input[type=range]::-webkit-slider-runnable-track{height:4px;border-radius:2px;background:linear-gradient(to right,var(--pri) var(--b),var(--outline) var(--b))}
input[type=range]::-moz-range-track{height:4px;border-radius:2px;background:linear-gradient(to right,var(--pri) var(--b),var(--outline) var(--b))}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:20px;height:20px;margin-top:-8px;border-radius:50%;background:var(--on)}
input[type=range]::-moz-range-thumb{width:20px;height:20px;border:0;border-radius:50%;background:var(--on)}

/* menus (M3 DropdownMenu), dialogs, sheet */
.dd{position:absolute;z-index:20;min-width:112px;max-width:280px;background:var(--sch);border-radius:4px;padding:8px 0;box-shadow:0 3px 10px rgba(0,0,0,.6)}
.dd button{display:flex;align-items:center;gap:12px;width:100%;min-height:48px;padding:0 12px;font-size:14px;line-height:20px;font-weight:500;color:var(--on)}
.dd button span{flex:1}
.dd button.mu{color:var(--onv)}
.dd .ck{color:var(--pri)}
.dlg{position:absolute;inset:0;z-index:30;display:grid;place-items:center;padding:24px}
.dlg .scrim,.sht .scrim{position:absolute;inset:0;background:var(--scrim)}
.dlgc{position:relative;width:100%;max-width:312px;background:var(--sch);border-radius:28px;padding:24px 24px 18px}
.dlgc h2{margin:0 0 16px;font-size:24px;line-height:32px;font-weight:400}
.dlgc p{margin:0 0 24px;font-size:14px;line-height:20px;color:var(--onv)}
.dlgc .db{display:flex;justify-content:flex-end;flex-wrap:wrap;gap:8px}
.otf{position:relative;border:1px solid var(--outline);border-radius:4px;height:56px;display:flex;align-items:center;padding:0 16px;background:inherit}
.otf:focus-within{border:2px solid var(--pri);padding:0 15px}
.otf label{position:absolute;left:12px;top:-9px;padding:0 4px;font-size:12px;line-height:16px;color:var(--onv);background:inherit;pointer-events:none;transition:all .15s}
.otf input{width:100%;font-size:16px;caret-color:var(--pri)}
.otf input::placeholder{color:transparent}
.otf input:focus::placeholder{color:var(--onv)}
.otf:has(input:placeholder-shown):not(:focus-within) label{top:15px;font-size:16px;line-height:24px}
.sht{position:absolute;inset:0;z-index:25}
.sheet{position:absolute;left:0;right:0;bottom:0;background:var(--sch);border-radius:28px 28px 0 0;padding:0 24px 24px;max-height:86%;overflow-y:auto}
.sheet::before{content:"";display:block;width:32px;height:4px;border-radius:2px;background:var(--onv);margin:22px auto 22px}
.sheet h2{margin:0 0 8px;font-size:20px;line-height:28px;font-weight:500}
.sheet p{margin:0 0 8px;color:var(--onv)}
.sheet .ckr{padding:0;font-size:16px;line-height:24px}
.sheet .ckb{margin:0 15px 0 3px}
.sheet .alt{display:block;width:100%;min-height:48px;padding:12px 0;text-align:left}
.btnrow{display:flex;justify-content:flex-end;flex-wrap:wrap}

/* settings */
.set{background:var(--canvas);z-index:8}
.set .hd{min-height:56px;display:flex;align-items:center;padding:0 4px;font-size:20px;line-height:28px;font-weight:500;flex:none}
.set .body{flex:1;overflow-y:auto;padding:0 16px 24px}
.sec{color:var(--pri);font-size:14px;line-height:20px;font-weight:500;margin:24px 0 4px}
.cap{margin-top:12px;font-weight:500}
.rad{display:flex;align-items:center;min-height:48px;width:100%;text-align:left;gap:14px}
.rb{width:20px;height:20px;border-radius:50%;border:2px solid var(--onv);margin-left:2px;flex:none}
.rad[aria-checked=true] .rb{border-color:var(--pri);background:radial-gradient(var(--pri) 0 4.5px,transparent 5px)}
.card{margin-top:12px;background:var(--surface);border-radius:12px;padding:12px}
.card .ch{display:flex;align-items:center}
.card .ch div{flex:1;min-width:0}
.card b{display:block;font-weight:500}
.card small{display:block;font-size:12px;line-height:16px;color:var(--onv);overflow-wrap:anywhere}
.form{display:flex;flex-direction:column;gap:8px}
.form>b{font-weight:500}
.sm{font-size:12px;line-height:16px;color:var(--onv)}
.mdl{display:flex;align-items:center;min-height:48px}
.mdl div{flex:1}.mdl small{display:block;font-size:12px;line-height:16px;color:var(--onv)}
.swr{display:flex;align-items:center;min-height:48px;margin-top:8px;width:100%;text-align:left;gap:12px}
.swr span{flex:1}.swr small{display:block;font-size:12px;line-height:16px;color:var(--onv)}
.swi{width:52px;height:32px;border-radius:16px;border:2px solid var(--outline);background:var(--sch);position:relative;flex:none}
.swi::after{content:"";position:absolute;left:6px;top:6px;width:16px;height:16px;border-radius:50%;background:var(--outline);transition:all .15s}
[aria-checked=true]>.swi{background:var(--pri);border-color:var(--pri)}
[aria-checked=true]>.swi::after{left:22px;top:2px;width:24px;height:24px;background:var(--onpri)}
.lic{font-size:12px;line-height:16px;color:var(--onv);margin-top:4px}

/* home: the editor's top bar shows, disabled, above it (ui/EditorScreen.kt EmptyState) */
.empty{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px;text-align:center}
.empty h1,.recent h1{font-size:28px;line-height:36px;font-weight:500;margin:0}
.empty p{color:var(--onv);margin:8px 0 24px}
.openp{min-height:52px;padding:0 28px;border-radius:20px 6px 20px 6px;background:var(--pri);color:var(--onpri);font-weight:500;display:inline-flex;align-items:center;gap:8px}
.openf{margin-top:12px;padding:12px;color:var(--onv);border-radius:14px 4px 14px 4px}
.recent{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;padding:16px}
.grid{flex:1;width:100%;display:grid;grid-template-columns:repeat(3,1fr);gap:8px;align-content:start;margin:16px 0;overflow-y:auto}
.grid button{aspect-ratio:1;border-radius:12px;background:var(--sch)}
.gear{position:absolute;top:0;right:0}
</style>

const opts=cap=>OPTS[cap].filter(o=>o[0]==='phone'||!A.hideCloud&&PROVIDERS.some(x=>x.id===o[0]));
const choice=cap=>{const o=opts(cap);return o.find(x=>x.join('|')===A.pick[cap])||o[0]||null};
const label=c=>`${PN[c[0]]} · ${c[1]}`;
const aiModes=()=>Object.keys(MODES).filter(k=>opts(k).length);

// ---------- document: layers top first, groups, the applied crop ----------
let L=[],G=[],nextId=20,layersHidden=false,bubble=null,changed=false,PW=3000,PH=4000,deband=true;
function demoDoc(){L=[{id:1,kind:'Sharpen',fx:newDetail(true)},{id:2,kind:'Color',fx:newColor({Temp:-18,Saturation:12}),steps:[step('subject')],group:10},
  {id:3,kind:'Color',fx:newColor({Exposure:20,Shadows:25}),steps:[step('background')],group:10}].map(l=>({name:'',visible:true,opacity:100,blend:'Normal',steps:[],group:null,...l}));
  G=[{id:10,name:'Sky',visible:true,collapsed:false,opacity:100}];layersHidden=false;changed=false;PW=3000;PH=4000;docCrop=newCrop()}
const grp=id=>G.find(g=>g.id===id),lay=id=>L.find(l=>l.id===id);
const title=l=>l.name||l.kind;
const shown=l=>l.visible&&grp(l.group)?.visible!==false&&!layersHidden;

// ---------- editor state ----------
let tool=null,D=null,C=null,maskMode=false,dirty=false,msel=null,mtool='brush',madd=true,addingSample=false;
const MORE={mask:false,detail:false,warp:false,crop:false}; // which More boxes are open (kept between tools, like the app)
let depthStatus=null,depthReady=false,subjectStatus=null,peopleFound=false,subjectFound=false,exporting=null,expScale=1,jobT=0;
const eraseOpen=()=>tool==='ai'&&D&&D.kind==='Retouch'&&!maskMode&&(A.mode==='erase'||A.mode==='fill');

// ---------- mask steps ----------
function step(type,o={}){const s={type,add:true,visible:true,feather:p('Feather',0,0,0,100),...o};
  if(type==='brush')s.ctx=mk();
  if(type==='gradient')Object.assign(s,{radial:false,x0:150,y0:80,x1:150,y1:240});
  if(type==='color')Object.assign(s,{samples:[],range:p('Range',30,30,0,100),smooth:p('Smooth',50,50,0,100)});
  if(type==='lum')Object.assign(s,{a:0,b:0,c:.25,d:.4,depth:false});
  return s}
const sIcon=s=>({brush:'brush',gradient:s.radial?'radial':'gradient',color:'eyedropper',lum:s.depth?'depth':'luminance',subject:'subject',background:'background',person:'person'})[s.type];
const sName=s=>({brush:'brush',gradient:s.radial?'radial gradient':'gradient',color:'color range',lum:s.depth?'depth range':'luminance range',subject:'subject',background:'background',person:'person'})[s.type];
const sLabel=s=>(s.add?'Add ':'Remove ')+sName(s);
const toolFor=s=>({brush:'brush',gradient:'gradient',color:'color',lum:'lum',subject:'subject',background:'subject',person:'person'})[s.type];
function addStep(s){s.add=madd;D.steps.push(s);msel=D.steps.length-1;mtool=toolFor(s);addingSample=false;dirty=true;
  if(s.type==='person')findPeople();if(s.type==='subject'||s.type==='background')findSubject();if(s.type==='lum'&&s.depth)measureDepth()}
function selectStep(i){msel=msel===i?null:i;const s=D.steps[i];if(s)mtool=toolFor(s);addingSample=false}
const LP={Shadows:[0,0,.25,.4],Midtones:[.25,.4,.6,.75],Highlights:[.6,.75,1,1]},DP={Near:[.6,.75,1,1],Middle:[.25,.4,.6,.75],Far:[0,0,.25,.4]};

// on-device jobs that run without a tap: the person matte, the subject, the depth map (once per photo)
function later(seq,set,done){let i=0;set(seq[0]);ui();const t=()=>{if(++i<seq.length){set(seq[i]);setTimeout(t,700)}else{set(null);done();ui()}renderBox()};setTimeout(t,700)}
function findPeople(){if(!peopleFound&&!subjectStatus)later(['Downloading AI model… 40%','Finding people…'],v=>subjectStatus=v,()=>{peopleFound=true;draw()})}
function findSubject(){if(!subjectFound&&!subjectStatus)later(['Finding the subject…'],v=>subjectStatus=v,()=>{subjectFound=true;draw()})}
function measureDepth(){if(!depthReady&&!depthStatus)later(['Measuring depth…'],v=>depthStatus=v,()=>{depthReady=true;draw()})}

// ---------- tools: open, leave, apply ----------
function openTool(k,edit=null,m=false){
  closeMenu();bubble=null;renderBubble();tool=k;maskMode=m;dirty=false;msel=null;mtool='brush';addingSample=false;
  if(k==='crop'){C=cl(docCrop);D=null;return ui()}
  if(k==='ai'){if(edit)A.mode=edit.kind==='Background'?'background':edit.fx==='fill'?'fill':'erase';if(!aiModes().includes(A.mode))A.mode='erase'}
  const kind=edit?edit.kind:k==='color'?'Color':k==='detail'?'Blur':k==='liquify'?'Liquify':A.mode==='background'?'Background':'Retouch';
  D={kind,edit:edit?edit.id:null,inv:false,steps:edit?cl(edit.steps):kind==='Background'?[step('person')]:[],
    fx:edit&&typeof edit.fx==='object'?cl(edit.fx):kind==='Color'?newColor():kind==='Blur'||kind==='Sharpen'?newDetail(kind==='Sharpen'):kind==='Background'?newBg():edit?edit.fx:null};
  if(kind==='Background')findPeople();
  ui()}
function switchMode(k){A.mode=k;A.asked=null;A.target=null;if(D.edit)return ui();
  const bg=k==='background';if(bg!==(D.kind==='Background')){D.kind=bg?'Background':'Retouch';D.fx=bg?newBg():null;D.steps=bg?[step('person')]:[];msel=null;if(bg)findPeople()}
  ui()}
function close(){tool=null;D=null;C=null;maskMode=false;A.asked=null;A.off=new Set;A.target=null;A.ask='';clearTimeout(jobT);A.running=null;closeMenu();ui()}
function leave(){if(dirty||A.asked)dialog('Discard changes?',[['Keep editing'],['Discard',close]]);else close()}
function apply(){
  if(D.edit){Object.assign(lay(D.edit),{fx:D.fx,steps:D.steps,kind:D.kind});changed=true}
  else if(dirty||D.steps.length||D.kind==='Background'){L.unshift({id:nextId++,kind:D.kind,name:'',visible:true,opacity:100,blend:'Normal',steps:D.steps,group:null,fx:D.fx});changed=true}
  close()}
const applyLabel=()=>D.edit?'Apply changes':`Apply as ${D.kind} layer`;

// ---------- the floating chrome ----------
const tl=(icon,lbl,f)=>`<button class="tl" aria-label="${lbl}" ${h(f)}><span class="m">${ic(icon)}</span></button>`;
const pi=(icon,desc,sel,f,o={})=>`<button class="pi${sel?' sel':''}${o.ul?' ul':''}" role="tab" aria-selected="${sel}" aria-label="${desc}" ${h(f)}>${ic(icon)}${o.dot?'<i class="dot"></i>':''}${o.sign!=null?`<span class="sb${o.sign?'':' m'}">${ic(o.sign?'plus':'minus')}</span>`:''}</button>`;
const sc=(html,gap=2,pad='')=>`<div class="sfw"><div class="sc" style="gap:${gap}px;${pad}">${html}</div></div>`;
const ok=(lbl,f)=>`<button class="ib ok" aria-label="${lbl}" ${h(f)}>${ic('check')}</button>`;
const mb=(f=()=>{maskMode=true;ui()})=>{const n=D.steps.length;return `<button class="mb${n?' on':''}" aria-label="${n?`Mask: ${n} steps. Edit`:'Mask: none. Add'}" ${h(f)}>${ic('mask')}${n?`<b>${n}</b>`:''}</button>`};
const reg=P=>{REG.set(++hn,P);return hn};
const sl=(P,w=36)=>`<input type="range" min="${P.min}" max="${P.max}" step="${P.snap?'any':1}" value="${P.v}" data-p="${reg(P)}" aria-label="${P.n}"><output class="val" style="min-width:${w}px"></output>`;
const lab=(t,w=84)=>`<span class="lab" style="min-width:${w}px">${t}</span>`;
const two=(t,s)=>`<span class="two"><b>${t}</b><small>${s}</small></span>`;
const srow=P=>`<div class="br p48">${lab(P.n)}${sl(P)}</div>`; // SliderRow: lines up with the main row's More button
const moreBtn=(k,desc='More settings')=>`<button class="ib mo${MORE[k]?' open':''}" aria-label="${MORE[k]?'Less':desc}" aria-expanded="${MORE[k]}" ${h(()=>{MORE[k]=!MORE[k];ui()})}>${ic('up')}</button>`;
const toolbox=(k,more,main,desc)=>`<div class="box">${MORE[k]?more.join(''):''}<div class="br">${main}${moreBtn(k,desc)}</div></div>`;
const chip=(t,on,f,desc='')=>`<button class="chip${on?' on':''}" role="tab" aria-selected="${on}"${desc?` aria-label="${desc}"`:''} ${h(f)}>${t}</button>`;
const status=(t,retry,cls='')=>retry&&t.startsWith("Couldn't")?`<button class="retry" ${h(retry)}>${t}. Tap to retry</button>`:`<span class="status ${cls}"><i class="spin"></i>${t}</span>`;
const hint=t=>`<span class="hint">${t}</span>`;
const changedTo=()=>{dirty=true};

function toolList(){return [['Color','adjust',()=>openTool('color')],['Detail','detail',()=>openTool('detail')],['Liquify','liquify',()=>openTool('liquify')],['Crop','crop',()=>openTool('crop')],['AI','sparkle',()=>openTool('ai')]]
  .map(([n,i,f])=>`<button class="tool" aria-label="${n}" ${h(f)}>${ic(i)}</button>`).join('')} // icons only; the names are for screen readers

// Color
function colorBar(){const c=D.fx;let chips='';
  CP.forEach((n,i)=>{if(n==='Temp')chips+=pi('curves','Curves'+(c.curve?', edited':''),c.sel<0,()=>{c.sel=-1;ui()},{ul:1,dot:c.curve}); // Curves sits with the tone controls
    const P=c.params[i];chips+=pi(n.toLowerCase(),`${n} ${show(P)}${n==='Exposure'?' stops':''}`,c.sel===i,()=>{c.sel=i;ui()},{ul:1,dot:P.v!==0})});
  return tl('adjust','Color. Back to tools',leave)+sc(chips)+mb()+ok(applyLabel(),apply)}
function colorBox(){const c=D.fx;if(c.sel<0)return curvesBox(c);const P=c.params[c.sel];
  return `<div class="box"><div class="br">${lab(P.n,92)}${sl(P,44)}<button class="ib" aria-label="Reset ${P.n}" ${h(()=>{P.v=0;dirty=true;ui()})}>${ic('reset')}</button></div></div>`}
function curvesBox(c){const col=['#fff','#FF6B5E','#6BD66B','#6BA8FF'][c.ch],S=c.ch===0&&c.curve,y=x=>S?x-.07*Math.sin(2*Math.PI*x):x,pts=(S?[0,.25,.75,1]:[0,1]).map(x=>[x,y(x)]); // demo S-curve; tap the graph to make it
  let path='';for(let i=0;i<=64;i++){const x=i/64;path+=(i?'L':'M')+x*100+' '+(1-y(x))*100}
  const grid=[1,2,3].map(q=>`M${q*25} 0v100M0 ${q*25}h100`).join('')+'M0 100L100 0';
  return `<div class="box curves"><div class="br" style="min-height:44px">${['RGB','R','G','B'].map((n,i)=>chip(n,i===c.ch,()=>{c.ch=i;ui()},n+' curve')).join('')}<span style="flex:1"></span><button class="ib" aria-label="Reset ${['RGB','R','G','B'][c.ch]} curve" ${h(()=>{if(c.ch===0)c.curve=false;ui()})}>${ic('reset')}</button></div>
    <svg viewBox="0 0 100 100" preserveAspectRatio="none" role="img" aria-label="Tone curve" ${h(()=>{if(c.ch===0&&!c.curve){c.curve=true;dirty=true;ui()}})}><path d="${grid}" stroke="var(--outv)" fill="none" vector-effect="non-scaling-stroke"/><path d="${path}" stroke="${col}" stroke-width="2" fill="none" vector-effect="non-scaling-stroke"/>
    ${pts.map(([x,y])=>`<path d="M${x*100} ${(1-y)*100}h0" stroke="#000" stroke-width="12" stroke-linecap="round" vector-effect="non-scaling-stroke"/><path d="M${x*100} ${(1-y)*100}h0" stroke="${col}" stroke-width="9" stroke-linecap="round" vector-effect="non-scaling-stroke"/>`).join('')}</svg></div>`}

// Detail
function detailBar(){const e=D.fx,k=d=>()=>{if(!D.edit&&e.sharpen!==d){D.kind=d?'Sharpen':'Blur';D.fx=newDetail(d);dirty=true;ui()}};
  return tl('detail','Detail. Back to tools',leave)+`<div class="row6">${pi('blur','Blur',!e.sharpen,k(false),{ul:1})}${pi('sharpen','Sharpen',e.sharpen,k(true),{ul:1})}</div>`+mb()+ok(applyLabel(),apply)}
function detailBox(){const e=D.fx,ps=e.sharpen?[e.amount,e.radius,e.clarity]:e.type==='Lens'?[e.amount,e.range,e.bloom]:e.type==='Motion'?[e.amount,e.angle]:[e.amount];
  const more=[...(e.sharpen?[]:[`<div class="br">${lab('Type')}${Object.keys(BICON).map(t=>pi(BICON[t],t+' blur',e.type===t,()=>{e.type=t;dirty=true;if(t==='Lens')measureDepth();ui()},{ul:1})).join('')}</div>`]),...ps.slice(1).map(srow)];
  const main=depthStatus&&!e.sharpen&&e.type==='Lens'?status(depthStatus,()=>{depthStatus=null;measureDepth()},'st16'):e.sharpen?two('Sharpen','Amount')+sl(e.amount):two(e.type,'Blur')+sl(e.amount);
  return toolbox('detail',more,main)}

// Liquify
function liquifyBar(){return tl('liquify','Liquify. Back to tools',leave)+sc(Object.keys(WICON).map(t=>pi(WICON[t],t,W.tool===t,()=>{W.tool=t;ui()},{ul:1})).join(''),4)+mb()+ok(applyLabel(),apply)}
function liquifyBox(){return toolbox('warp',[srow(W.str),srow(W.soft),...(W.tool==='Twirl'?[`<div class="br">${lab('Direction')}${pi('rotate','Clockwise',!W.rev,()=>{W.rev=false;ui()},{ul:1})}${pi('rotateback','Counterclockwise',W.rev,()=>{W.rev=true;ui()},{ul:1})}</div>`]:[])],
  two(W.tool,'Size')+sl(W.size))}

// Crop: a document setting, not a layer
function newCrop(){return{r:{x0:0,y0:0,x1:300,y1:400},aspect:'Free',portrait:true,angle:p('Rotate',0,0,-45,45,v=>v.toFixed(1)+'°'),pv:p('Vertical',0),ph:p('Horizontal',0),rot:0,fh:false}}
let docCrop=newCrop();
const ASPECTS=['Free','Original','1:1','4:5','3:2','16:9'];
const cropIdentity=t=>t.aspect==='Free'&&!t.r.x0&&!t.r.y0&&t.r.x1===300&&t.r.y1===400&&!t.angle.v&&!t.pv.v&&!t.ph.v&&!t.rot&&!t.fh;
function cropBar(){const id=cropIdentity(C);
  return tl('crop','Crop. Back to tools',leave)+`<button class="ib" aria-label="Rotate 90° clockwise" ${h(()=>{C.rot=(C.rot+1)%4;C.portrait=!C.portrait;dirty=true;ui()})}>${ic('turn')}</button><button class="ib" aria-label="Flip horizontally" ${h(()=>{C.fh=!C.fh;dirty=true;ui()})}>${ic('flip')}</button><span style="flex:1"></span>`
    +`<button class="ib" aria-label="Reset crop" ${id?'disabled':''} ${h(()=>{C=newCrop();dirty=true;ui()})}>${ic('reset')}</button>`+ok('Apply crop',()=>{docCrop=C;changed=true;close()})}
function cropBox(){const t=C,cs=P=>`<div class="br">${lab(P.n,100)}${sl(P,48)}<span style="width:48px;flex:none"></span></div>`;
  const chips=ASPECTS.map(a=>{const sel=t.aspect===a;let l=a;if(sel&&a.includes(':')){const[x,y]=a.split(':').map(Number);if(t.portrait!==(x<y))l=y+':'+x} // a selected preset reads as the crop is
    return chip(l,sel,()=>{if(a==='Free')t.aspect='Free';else{if(sel)t.portrait=!t.portrait;else{t.aspect=a;t.portrait=a==='Original'?true:(t.r.x1-t.r.x0)<(t.r.y1-t.r.y0)}aspectRect()}dirty=true;ui()})}).join(''); // tapping the selected one turns it
  return toolbox('crop',[cs(t.angle),cs(t.pv),cs(t.ph)],sc(chips,6,'padding-left:6px'),'Rotate and perspective')}

// Mask: what you add in the bar (sign + step types), the steps and the current tool's settings above
function maskBar(){const s=msel!=null?D.steps[msel]:null,sel=(mt,f=()=>true)=>mtool===mt&&f(s),sign=madd?'Add':'Remove';
  const T=[['brush','brush',sel('brush'),()=>{mtool='brush'}],['gradient','gradient',sel('gradient'),()=>addStep(step('gradient'))],
    ['eyedropper','color range',sel('color'),()=>addStep(step('color'))],['luminance','luminance range',sel('lum',x=>x&&!x.depth),()=>addStep(step('lum'))],
    ['depth','depth range',sel('lum',x=>x&&x.depth),()=>addStep(step('lum',{a:.6,b:.75,c:1,d:1,depth:true}))],['subject','subject',sel('subject',x=>x&&x.type==='subject'),()=>addStep(step('subject'))],
    ['background','background',sel('subject',x=>x&&x.type==='background'),()=>addStep(step('background'))],['person','person',!!s&&s.type==='person',()=>addStep(step('person'))]];
  return tl('mask',`${D.kind} mask. Back to the tool`,()=>{maskMode=false;ui()})+sc(T.map(([i,n,on,f])=>pi(i,`${sign} ${n}`,on,()=>{f();ui()},{sign:madd})).join(''),6)
    +`<button class="ib${D.inv?' pri':''}" aria-pressed="${D.inv}" aria-label="${D.inv?'Invert on':'Invert off'}" ${h(()=>{D.inv=!D.inv;dirty=true;ui()})}>${ic('invert')}</button>`+ok('Done with mask',()=>{maskMode=false;ui()})}
function maskBox(){let out='';const s=msel!=null?D.steps[msel]:null;
  if(D.steps.length)out+=`<div class="box"><div class="br">${sc(D.steps.map((x,i)=>`<button class="stc${i===msel?' sel':''}${x.visible?'':' hid'}" role="tab" aria-selected="${i===msel}" aria-label="${sLabel(x)}${x.visible?'':', hidden'}" ${h(()=>{selectStep(i);ui()})}><span class="f">${ic(sIcon(x))}<span class="sb${x.add?'':' m'}">${ic(x.add?'plus':'minus')}</span></span></button>`).join(''),6,'padding-left:6px')}
    ${s?`<button class="ib" aria-label="${s.add?'Make this step remove':'Make this step add'}" ${h(()=>{s.add=!s.add;dirty=true;ui()})}>${ic(s.add?'minus':'plus')}</button><button class="ib" aria-label="${s.visible?'Hide step':'Show step'}" ${h(()=>{s.visible=!s.visible;dirty=true;ui()})}>${ic(s.visible?'eye':'eyeoff')}</button><button class="ib" aria-label="Delete step" ${h(()=>{D.steps.splice(msel,1);msel=null;dirty=true;ui()})}>${ic('trash')}</button>`:''}</div></div>`;
  const others=L.filter(l=>l.id!==D.edit&&l.steps.length);
  const more=[`<div class="br" style="padding:0 8px"><button class="tb s" ${others.length?'':'disabled'} ${h(el=>openMenu(el,others.map(l=>({label:`${l.kind} layer ${L.length-L.indexOf(l)}`,f:()=>{D.steps=cl(l.steps);msel=null;dirty=true;ui()}}))))}>Copy mask from…</button><button class="tb s" ${D.steps.length||D.inv?'':'disabled'} ${h(()=>{D.steps=[];D.inv=false;msel=null;dirty=true;ui()})}>Clear mask</button></div>`,
    ...(mtool==='brush'?[srow(BR.soft),srow(BR.flow)]:mtool==='color'&&s&&s.type==='color'?[srow(s.smooth)]:[]),...(s?[srow(s.feather)]:[])];
  let main=`<button class="sgn${madd?'':' m'}" aria-label="${madd?'Adding. Tap to remove instead':'Removing. Tap to add instead'}" ${h(()=>{madd=!madd;ui()})}><span>${ic(madd?'plus':'minus')}</span></button>`;
  if(mtool==='brush')main+=`<span class="lab" style="min-width:36px;padding:0">Size</span>${sl(BR.size)}`;
  else if(mtool==='gradient')main+=s&&s.type==='gradient'?`<div class="row6">${chip('Linear',!s.radial,()=>{s.radial=false;dirty=true;ui()})}${chip('Radial',s.radial,()=>{s.radial=true;dirty=true;ui()})}</div>`:hint('Tap the gradient icon to add one');
  else if(mtool==='color')main+=!s||s.type!=='color'||!s.samples.length?hint(!s||s.type!=='color'?'Tap the color icon to add one':'Tap the photo to pick a color')
    :s.samples.map((q,k)=>`<button class="smp" aria-label="Sample ${k+1}${s.samples.length>1?'. Tap to remove':''}" ${h(()=>{if(s.samples.length>1){s.samples.splice(k,1);dirty=true;ui()}})}><span style="background:rgb(${q})"></span></button>`).join('')
      +(s.samples.length<4?`<button class="ib${addingSample?' pri':''}" aria-label="${addingSample?'Next tap adds a sample. Tap to cancel':'Add another sample'}" ${h(()=>{addingSample=!addingSample;ui()})}>${ic('plus')}</button>`:'')+`<input type="range" min="0" max="100" value="${s.range.v}" data-p="${reg(s.range)}" aria-label="Color range">`;
  else if(mtool==='lum'){const st=s&&s.depth&&depthStatus;
    if(!s||s.type!=='lum')main+=hint('Tap the luminance or depth icon to add one');
    else if(st)main+=status(st,()=>{depthStatus=null;measureDepth()});
    else{const P=s.depth?DP:LP,name=Object.keys(P).find(n=>P[n].join()===[s.a,s.b,s.c,s.d].join());
      main+=`<button class="tb w" style="width:96px;font-size:12px" ${h(()=>{const ks=Object.keys(P),nx=P[ks[(ks.indexOf(name)+1)%ks.length]];[s.a,s.b,s.c,s.d]=nx;dirty=true;ui()})}>${name||'Custom'}</button><div class="lstrip" id="lstrip" role="group" aria-label="${s.depth?'Depth range, far to near,':'Luminance range'} ${Math.round(s.a*100)} to ${Math.round(s.d*100)} percent"><svg></svg></div>`}}
  else if(mtool==='subject')main+=subjectStatus?status(subjectStatus,()=>{subjectStatus=null;findSubject()}):hint(madd?'Tap what to select. Remove mode: tap what to leave out':'Tap what to leave out');
  else main+=subjectStatus?status(subjectStatus,()=>{subjectStatus=null;findPeople()}):hint('The people in the photo, hair included');
  return out+toolbox('mask',more,main)}

// AI: mode icons; the mask (modes that paint one); the split run button (tap runs, ▾ picks provider · model)
function aiBar(){const m=A.mode,idle=!A.running,modes=D.kind==='Background'&&D.edit?['background']:aiModes(),c=choice(m),ready=idle&&c&&aiReady(m);
  const ap=m==='ask'&&A.asked,n=ap?A.asked.ops.length-A.off.size:0;
  const run={fill:'Fill the painted area',upscale:'Upscale the photo',ask:ap?`Apply ${n} changes`:'Send the request',background:D.edit?'Apply changes':'Replace the background'}[m]||'Erase the painted area';
